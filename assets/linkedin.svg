<svg xmlns="http://www.w3.org/2000/svg" width="124" height="40" viewBox="0 0 124 40" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">LinkedIn</title>
  <desc id="desc">Connect with Dhravid Kumar on LinkedIn.</desc>
  <style>
    .panel { fill: #f8f5ec; stroke: #d8ddcd; }
    .ink { fill: #243c30; }
    .muted { fill: #546451; }
    .accent { fill: #335744; }
    .rule { stroke: #cbd4c4; }
    .soft { fill: #e8edde; }
    text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .compact { display: none; }
    @media (max-width: 480px) {
      .wide { display: none; }
      .compact { display: inline; }
      .footer-detail { font-size: 32px; }
    }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #161f19; stroke: #35483b; }
      .ink { fill: #f2f0e6; }
      .muted { fill: #bac8b7; }
      .accent { fill: #b0d2b8; }
      .rule { stroke: #425543; }
      .soft { fill: #293d2f; }
    }
  </style>
  <rect x="0.5" y="0.5" width="123" height="39" rx="9" class="panel"/>
  <rect x="20" y="12" width="17" height="17" rx="3" class="accent"/><text x="28.5" y="25" font-size="13" font-weight="700" fill="#f8f5ec">in</text>
  <text x="79" y="26" font-size="16" class="ink">LinkedIn</text>
</svg>
