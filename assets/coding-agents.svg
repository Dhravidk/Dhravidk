<svg xmlns="http://www.w3.org/2000/svg" width="800" height="222" viewBox="0 0 800 222" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Coding-Agent Research Library</title>
  <desc id="desc">Literature discovery, source provenance, and thematic research indexes. Open the repository.</desc>
  <style>
    .panel { fill: #f8f5ec; stroke: #d8ddcd; }
    .ink { fill: #243c30; }
    .muted { fill: #546451; }
    .accent { fill: #335744; }
    .rule { stroke: #cbd4c4; }
    .soft { fill: #e8edde; }
    text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .compact { display: none; }
    @media (max-width: 480px) {
      .wide { display: none; }
      .compact { display: inline; }
      .footer-detail { font-size: 32px; }
    }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #161f19; stroke: #35483b; }
      .ink { fill: #f2f0e6; }
      .muted { fill: #bac8b7; }
      .accent { fill: #b0d2b8; }
      .rule { stroke: #425543; }
      .soft { fill: #293d2f; }
    }
  </style>
  <rect x="1" y="1" width="798" height="220" rx="16" class="panel"/>
  <text x="400" y="43" class="muted" font-size="17" letter-spacing="2.5">RESEARCH INFRASTRUCTURE</text>
  <text x="400" y="95" class="ink" font-size="36" font-weight="600">Coding-Agent Research Library</text>
  <g class="wide">
  <text x="400" y="141" class="muted" font-size="26" >Literature discovery, source provenance,</text>
  <text x="400" y="177" class="muted" font-size="26" >and thematic research indexes.</text>
  </g>
  <g class="compact">
  <text x="400" y="144" class="muted" font-size="32" >Literature discovery and provenance.</text>
  <text x="400" y="184" class="muted" font-size="32" >Thematic research indexes.</text>
  </g>
  <path d="M380 202H420" class="rule" stroke-width="2"/>
</svg>
