<svg xmlns="http://www.w3.org/2000/svg" width="800" height="80" viewBox="0 0 800 80" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Explore the work</title>
  <desc id="desc">Selected public engineering projects. Each project card links to its repository.</desc>
  <style>
    .panel { fill: #f8f5ec; stroke: #d8ddcd; }
    .ink { fill: #243c30; }
    .muted { fill: #546451; }
    .accent { fill: #335744; }
    .rule { stroke: #cbd4c4; }
    .soft { fill: #e8edde; }
    text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .compact { display: none; }
    @media (max-width: 480px) {
      .wide { display: none; }
      .compact { display: inline; }
      .footer-detail { font-size: 32px; }
    }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #161f19; stroke: #35483b; }
      .ink { fill: #f2f0e6; }
      .muted { fill: #bac8b7; }
      .accent { fill: #b0d2b8; }
      .rule { stroke: #425543; }
      .soft { fill: #293d2f; }
    }
  </style>
  <path d="M32 42H220M580 42H768" class="rule" stroke-width="1"/>
  <text x="400" y="49" class="muted" font-size="20" letter-spacing="3">EXPLORE THE WORK</text>
</svg>
